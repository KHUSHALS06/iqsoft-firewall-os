<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'self'">
<title>Sign in | IQSOFT Firewall OS</title>
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/login.css">
</head>
<body class="login-body">
<main class="login-page">
  <aside class="login-side">
    <div class="side-inner">
      <div class="lock-stage" aria-hidden="true">
        <svg class="lock-svg" viewBox="0 0 128 128">
          <circle class="lock-ring" cx="64" cy="64" r="60"/>
          <circle class="lock-ring r2" cx="64" cy="64" r="60"/>
          <circle class="lock-ring r3" cx="64" cy="64" r="60"/>
          <circle cx="64" cy="64" r="46" fill="#ffffff" stroke="#d6e6f9" stroke-width="2"/>
          <path class="lock-shackle" d="M50 62V50a14 14 0 0 1 28 0v12" fill="none" stroke="#0866cc" stroke-width="7" stroke-linecap="round"/>
          <rect x="40" y="60" width="48" height="36" rx="8" fill="#0a7cf5"/>
          <circle cx="64" cy="75" r="5" fill="#ffffff"/>
          <rect x="62" y="77" width="4" height="10" rx="2" fill="#ffffff"/>
        </svg>
      </div>

      <div class="welcome">
        <div class="welcome-line">Welcome to</div>
        <h2 class="welcome-title"><span class="accent">IQSOFT</span> Firewall</h2>
        <span id="welcomeUser" class="welcome-user"></span>
      </div>
    </div>

    <svg class="side-wave w1" viewBox="0 0 1200 190" preserveAspectRatio="none" aria-hidden="true">
      <path d="M0 90Q150 30 300 90T600 90T900 90T1200 90V190H0Z" fill="#9fd0ff" fill-opacity=".45"/>
    </svg>
    <svg class="side-wave w2" viewBox="0 0 1200 190" preserveAspectRatio="none" aria-hidden="true">
      <path d="M0 120Q150 70 300 120T600 120T900 120T1200 120V190H0Z" fill="#0a7cf5" fill-opacity=".22"/>
    </svg>
    <div class="side-foot">v1.0.0</div>
  </aside>

  <section class="login-panel">
    <div class="glass login-card">
      <h1 class="login-title"><span class="accent">IQSOFT</span></h1>

      <form id="loginForm" method="post" novalidate>
        <div id="formError" class="alert" role="alert" hidden></div>

        <label class="field">
          <span class="input-wrap">
            <svg class="input-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12a4.500 4.500 0 1 0 0-9 4.500 4.500 0 0 0 0 9Zm0 2c-4.400 0-8 2.200-8 5v1h16v-1c0-2.800-3.600-5-8-5Z" fill="currentColor"/></svg>
            <input id="username" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder=" " required autofocus>
            <span class="float-label">Username</span>
          </span>
        </label>

        <label class="field">
          <span class="input-wrap">
            <svg class="input-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M17 9h-1V7a4 4 0 0 0-8 0v2H7a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2Zm-7-2a2 2 0 1 1 4 0v2h-4V7Z" fill="currentColor"/></svg>
            <input id="password" name="password" type="password" autocomplete="current-password" placeholder=" " required>
            <span class="float-label">Password</span>
            <button id="togglePassword" class="icon-btn" type="button" aria-label="Show password">
              <svg class="eye-open" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5C6.500 5 2.700 9 1 12c1.700 3 5.500 7 11 7s9.300-4 11-7c-1.700-3-5.500-7-11-7Zm0 11.500a4.500 4.500 0 1 1 0-9 4.500 4.500 0 0 1 0 9Zm0-7a2.500 2.500 0 1 0 0 5 2.500 2.500 0 0 0 0-5Z" fill="currentColor"/></svg>
              <svg class="eye-closed" viewBox="0 0 24 24" aria-hidden="true" hidden><path d="m3.300 2 18.700 18.700-1.300 1.300-3.200-3.200A11.400 11.400 0 0 1 12 19C6.500 19 2.700 15 1 12a18.600 18.600 0 0 1 4.300-5.200L2 3.300 3.300 2Zm4.400 6.400A4.500 4.500 0 0 0 12 16.500c.6 0 1.100-.1 1.600-.3l-1.600-1.600a2.500 2.500 0 0 1-2.600-2.600L7.700 8.400ZM12 5c5.500 0 9.300 4 11 7a18.500 18.500 0 0 1-3 4l-2.900-2.900A4.500 4.500 0 0 0 11 8.600L8.600 6.200A11 11 0 0 1 12 5Z" fill="currentColor"/></svg>
            </button>
          </span>
        </label>

        <button id="submitBtn" class="btn-primary" type="submit">
          <span class="btn-label">Sign in</span>
          <span class="spinner" aria-hidden="true"></span>
        </button>
      </form>
    </div>
  </section>
</main>

<script src="/js/core/api.js"></script>
<script src="/js/login.js"></script>
</body>
</html>
